name: concept-validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts-and-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --index-url https://pypi.org/simple -r requirements-dev.txt
      - run: python tools/export_schemas.py --check
        env:
          PYTHONPATH: src
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - run: python -m build --no-isolation
      - run: python -m pip install --no-deps .
      - run: python -c "from fox_engine import FoxEngine; assert len(FoxEngine().registry.list()) == 8"
