[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fox-engine"
version = "0.1.0.dev0"
description = "Deterministic, agent-neutral falsification-oriented engineering support"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "FOX ENGINE contributors"}]
dependencies = []
classifiers = ["Development Status :: 2 - Pre-Alpha", "Programming Language :: Python :: 3"]

[project.optional-dependencies]
dev = ["jsonschema>=4.23,<5", "build>=1.2,<2"]

[project.scripts]
fox = "fox_engine.adapters.stdio:main"

[project.urls]
Repository = "https://github.com/chatgptopenaiagi/FOX-ENGINE"

[tool.setuptools.packages.find]
where = ["src"]
